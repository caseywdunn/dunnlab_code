# tmux configuration — tuned for long-lived sessions over SSH (HPC login nodes,
# remote workstations). Copy to ~/.tmux.conf.
#
# Reload after editing:  prefix + r
# Companion cheat sheet: tmux.md (in this directory)

# ---------------------------------------------------------------------------
# Core
# ---------------------------------------------------------------------------
set -g history-limit 100000
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# No delay after Escape. Without this, Esc in vim/less feels laggy inside tmux.
set -sg escape-time 0

# Let vim & friends see focus gain/loss (autoread, cursor shape, etc.)
set -g focus-events on

# Hold prefix-less repeats (pane resize) open a bit longer.
set -sg repeat-time 600

# Only shrink a window to the smallest client that is *looking* at it.
setw -g aggressive-resize on

# ---------------------------------------------------------------------------
# Scrolling & copy mode
# ---------------------------------------------------------------------------
setw -g mode-keys vi

# Copy to the SYSTEM clipboard via OSC 52. This is what makes copy/paste work
# over SSH with no X11 forwarding and no xclip installed — tmux hands the text
# to your *local* terminal emulator. See the note at the bottom of this file.
set -g set-clipboard on

# vi-style selection: v to start, C-v for a rectangle, y to yank.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Smoother wheel: 3 lines per notch instead of tmux's jumpy 5.
bind -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

# Releasing a mouse drag copies but KEEPS you in copy mode at your scroll
# position. tmux's default cancels and snaps back to the prompt, which is the
# single most annoying scroll behaviour out of the box.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Double-click copies a word, triple-click copies a line.
bind -n DoubleClick1Pane copy-mode \; send -X select-word \; send -X copy-selection-no-clear
bind -n TripleClick1Pane copy-mode \; send -X select-line \; send -X copy-selection-no-clear

# Prefix + Enter to enter copy mode (in addition to the default prefix + [).
bind Enter copy-mode
# Prefix + / to enter copy mode and search backward immediately.
bind / copy-mode \; send -X search-backward ""

# ---------------------------------------------------------------------------
# Windows & panes
# ---------------------------------------------------------------------------
# Number from 1 — easier to reach than 0, and close the gaps on kill.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive splits that also inherit the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Alt+arrow to move between panes without the prefix.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Prefix + HJKL to resize, repeatable (hold the key).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Keep manual window names; don't let every command rewrite them.
setw -g allow-rename off
set -g set-titles on
set -g set-titles-string "#S:#W — #H"

# Flag windows with background output, but don't ring the bell.
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-interval 5
set -g display-time 2000
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour39][#S] "
set -g status-right "#H | %Y-%m-%d %H:%M"
set -g status-right-length 50

# ---------------------------------------------------------------------------
# Reload
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---------------------------------------------------------------------------
# Clipboard note
# ---------------------------------------------------------------------------
# `set-clipboard on` uses the OSC 52 escape sequence, so the copy lands in the
# clipboard of the machine your *terminal* runs on, even across SSH. Your local
# terminal has to permit it:
#
#   iTerm2      Preferences > General > Selection >
#               "Applications in terminal may access clipboard"
#   kitty       on by default (clipboard_control)
#   WezTerm     on by default
#   Alacritty   on by default
#   Windows Terminal / VS Code   on by default
#   GNOME Terminal   NOT supported — install xclip/xsel and replace the
#               copy-selection-and-cancel binding with:
#               send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
#
# To paste INTO tmux, use your terminal's normal paste (Cmd-V / Ctrl-Shift-V).
# prefix + ] pastes tmux's own internal buffer, which is a separate thing.
