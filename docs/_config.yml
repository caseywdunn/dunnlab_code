title: Dunn Lab Code
description: Claude Code skills and lab practices for the Dunn Lab
remote_theme: just-the-docs/just-the-docs
url: "https://dunnlab.org"
baseurl: "/dunnlab_code"

# Required for remote_theme on GitHub Pages
plugins:
  - jekyll-remote-theme

# Navigation
aux_links:
  "GitHub Repo":
    - "https://github.com/caseywdunn/dunnlab_code"

# Callouts must be declared or `{: .warning }` renders as an unstyled
# paragraph — the class is emitted but the theme has no rule for it.
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
